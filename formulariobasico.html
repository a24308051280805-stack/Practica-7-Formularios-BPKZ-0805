<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Formularios en HTML</title>
	<!-- Aquí ponemos el nombre de la página -->

</head>

<body>
<!-- Aquí empieza todo lo que se va a mostrar -->

	<h1>Formularios en HTML</h1>
	<!-- h1 sirve para poner el título principal -->

	<p>Un formulario sirve para ingresar datos.</p>
	<!-- p sirve para escribir un párrafo -->


	<h2>Formulario básico</h2>
	<!-- Este es el formulario más sencillo -->

	<form>
		Ingresa tu nombre:
		<input type="text" name="nombre">
		<!-- text sirve para escribir texto -->

		<br>

		<input type="submit" value="Enviar">
		<!-- submit crea un botón para enviar -->
	</form>
</body>
</html>
